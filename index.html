<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An easy, customisable budget tracker for bills, income, spending and savings goals.">
  <meta name="theme-color" content="#ffffff">
  <title>Budgetlog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%231d6f55'/><text x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>$</text></svg>">

  <!-- Styles: tokens & accessibility → layout → components -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="root" aria-live="off"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">This budget app needs JavaScript turned on.</p></noscript>

  <!-- When switching to Supabase, un-comment this line (and set config.backend):
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  -->

  <!-- 1. Settings -->
  <script src="js/config.js"></script>
  <!-- 2. Core helpers (no screen code) -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/recurrence.js"></script>
  <!-- 3. Data: storage → login → budget data -->
  <script src="js/data/storage.js"></script>
  <script src="js/data/auth.js"></script>
  <script src="js/data/store.js"></script>
  <script src="js/core/calc.js"></script>
  <!-- 4. Shared interface pieces -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/forms.js"></script>
  <!-- 5. Pages (one file each) -->
  <script src="js/app.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/bills.js"></script>
  <script src="js/pages/income.js"></script>
  <script src="js/pages/spending.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/insights.js"></script>
  <script src="js/pages/goals.js"></script>
  <script src="js/pages/organise.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/help.js"></script>
</body>
</html>
